<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي المباني الخضراء | Green Buildings Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Press+Start+2P&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="cloud" style="top:8%; animation-duration:38s;">☁️</div>
<div class="cloud" style="top:20%; animation-duration:55s; animation-delay:-20s;">☁️</div>
<div class="cloud" style="top:4%; animation-duration:70s; animation-delay:-45s;">☁️</div>
<div class="qblock" style="left:13%; top:26%;">?</div>
<div class="qblock" style="right:13%; top:18%; animation-delay:-1.1s;">?</div>
<div class="spin-coin" style="left:30%; top:14%;">🪙</div>
<div class="spin-coin" style="left:70%; top:30%; animation-delay:-0.5s;">🪙</div>
<div class="spin-coin" style="left:48%; top:8%; animation-delay:-0.9s;">🪙</div>

<div class="toolbar">
  <button class="music-btn" id="langBtn" type="button">English</button>
  <button class="music-btn hidden" id="logoutBtn" type="button"></button>
</div>

<main>
  <div class="card" id="card"></div>
  <section class="card board">
    <div class="board-head">
      <div class="board-title">🏆 <span id="boardTitle"></span></div>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncLabel"></span></div>
    </div>
    <div class="day-tabs" id="boardTabs"></div>
    <ol class="board-list" id="boardList"></ol>
    <div class="my-rank" id="myRank"></div>
  </section>
</main>

<script src="config.js"></script>
<script src="lists.js"></script>
<script src="scene.js"></script>
<script src="data/questions.js"></script>
<script src="app.js"></script>
</body>
</html>
