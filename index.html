<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي المباني الخضراء | Green Buildings Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- decoration -->
<div class="sun"></div>
<div class="cloud" style="top:8%;animation-duration:60s">☁️</div>
<div class="cloud" style="top:22%;animation-duration:85s;animation-delay:-30s">☁️</div>
<div class="cloud" style="top:14%;animation-duration:110s;animation-delay:-70s;font-size:2.2rem">☁️</div>
<div class="leaf-float" style="right:6%;top:40%">🌿</div>
<div class="leaf-float" style="left:5%;top:60%;animation-delay:-1.2s">🍃</div>
<div class="ground"><span class="tree" style="left:6%">🌳</span><span class="tree" style="left:30%">🏡</span><span class="tree" style="left:58%">🌲</span><span class="tree" style="left:82%">☀️</span></div>

<div class="toolbar">
  <button id="langBtn" class="pill" type="button">English</button>
  <button id="soundBtn" class="pill" type="button">🔊</button>
  <button id="logoutBtn" class="pill hidden" type="button"></button>
</div>

<main>
  <div class="card" id="card"></div>

  <section class="board">
    <div class="board-head">
      <div class="board-title">🏆 <span id="boardTitle"></span></div>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncLabel"></span></div>
    </div>
    <div class="day-tabs" id="boardTabs"></div>
    <ol class="board-list" id="boardList"></ol>
    <div class="my-rank" id="myRank"></div>
  </section>
</main>

<script src="config.js"></script>
<script src="data/questions.js"></script>
<script src="app.js"></script>
</body>
</html>
